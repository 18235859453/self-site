# Pages CMS: https://pagescms.org/docs/configuration/
settings:
  content:
    merge: true

media:
  - name: uploads
    label: 文章图片
    input: static/uploads
    output: /self-site/uploads
    rename: random
    extensions: [jpg, jpeg, png, webp, gif, avif]

content:
  - name: posts
    label: 文章
    type: collection
    path: content/post
    format: yaml-frontmatter
    subfolders: true
    # Exclusions are basenames, not glob patterns.
    exclude: [index.en.md, _index.md, _index.en.md]
    # Chinese titles are stripped by the CMS slugifier; use automatic dates.
    filename:
      template: "{year}-{month}-{day}-{hour}{minute}{second}/index.md"
      field: false
    view:
      layout: tree
      node:
        filename: index.md
        hideDirs: nodes
      primary: title
      fields: [title, date, draft]
      sort: [date, title]
      search: [title, description]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 简介
        type: text
        description: 显示在文章卡片上的简短介绍，可不填。
      - name: date
        label: 发布日期
        type: date
        required: true
        description: 请选择今天或过去的日期；未来日期不会自动定时上线。
        options:
          format: yyyy-MM-dd
      - name: draft
        label: 保存为草稿
        type: boolean
        default: true
        description: 开启时不展示在博客上；关闭并保存后自动部署。草稿仍保存在 GitHub 仓库中。
      - name: image
        label: 封面图
        type: image
        options:
          media: uploads
      - name: body
        label: 正文
        type: rich-text
        required: true
        description: 可以直接排版和上传图片。含公式、HTML 或相册排版的旧文章请使用 Source 源码模式编辑。
        options:
          format: markdown
          media: uploads
          switcher: true
      - name: categories
        label: 分类
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: slug
        label: 自定义网址（可选）
        type: string
        description: 留空时网址按标题生成，请避免同名文章。填写唯一标识可固定链接；发布后修改标识会改变链接。
      - name: toc
        label: 显示目录
        type: boolean
        default: true
      - name: comments
        label: 开启评论
        type: boolean
        default: true
